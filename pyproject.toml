[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rehab-center-system"
version = "0.1.0"
description = "Scheduling logic for the Rehab Center Excel system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["Python"]
